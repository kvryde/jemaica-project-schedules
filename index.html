<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3b34">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jemaica Schedule</title>
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1c2321; --muted:#6b7773; --line:#dcdad3;
  --accent:#1f6f5c; --accent-ink:#ffffff; --today:#e4f1ec; --past:#b5bbb8; --warn:#c2410c;
  --stage:#d8d6cf; --phone:#101413;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a211f; --ink:#e8ece9; --muted:#8c9a95; --line:#2a3330;
    --accent:#4fb89c; --accent-ink:#06130f; --today:#1d2b27; --past:#55615d; --warn:#f08a4b;
    --stage:#0b0e0d; --phone:#050706; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211f; --ink:#e8ece9; --muted:#8c9a95; --line:#2a3330;
  --accent:#4fb89c; --accent-ink:#06130f; --today:#1d2b27; --past:#55615d; --warn:#f08a4b;
  --stage:#0b0e0d; --phone:#050706; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--stage);color:var(--ink);overflow:hidden}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:min(390px,100%);height:min(820px,100%);background:var(--phone);border-radius:46px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--bg)}
body.mobile #stage{display:block}
body.mobile #phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.mobile #screen{border-radius:0}
body.mobile #homebar{display:none}

/* home screen */
#home{position:absolute;inset:0;background:linear-gradient(165deg,#1d3b34,#0e1d2b 60%,#2b1d3a);color:#fff;padding:54px 22px 22px;display:flex;flex-direction:column}
#clock{text-align:center;margin-top:18px}
#clock b{display:block;font-size:64px;font-weight:300;letter-spacing:-2px}
#clock span{font-size:15px;opacity:.8}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;margin-top:48px}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;background:none;border:0;color:#fff;font-family:inherit;cursor:pointer;position:relative}
.ico i{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:26px;background:rgba(255,255,255,.14)}
.ico.app i{background:#f3f1ec;color:#1f6f5c;font-weight:700;flex-direction:column;font-size:11px;line-height:1;padding-top:3px;display:flex;align-items:center;justify-content:center}
.ico.app i em{font-style:normal;font-size:25px;color:#1c2321;margin-top:2px}
.ico.app i small{font-size:9px;color:#c2410c;letter-spacing:.5px}
.badge{position:absolute;top:-5px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e5484d;color:#fff;font-size:12px;display:none;place-items:center;font-weight:600}
#dock{margin-top:auto;background:rgba(255,255,255,.14);border-radius:26px;padding:12px;display:flex;justify-content:space-around}

/* app */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
#app.open{transform:none}
body.mobile #app{transition:none}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
body:not(.mobile) header{padding-top:42px}
header h1{font-size:22px;font-weight:700;letter-spacing:-.4px;flex:1}
header h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:1px}
.hb{border:1px solid var(--line);background:var(--surface);color:var(--ink);height:36px;padding:0 12px;border-radius:18px;font:inherit;font-size:13px;cursor:pointer}
.hb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.mh{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 16px 8px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.mh span{color:var(--muted);font-weight:400}
.day{display:flex;gap:14px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.day:active{background:var(--surface)}
.dn{width:42px;flex:none;text-align:center}
.dn b{display:block;font-size:20px;line-height:1.1;font-weight:600}
.dn span{font-size:11.5px;color:var(--muted)}
.day.we .dn span{color:var(--accent)}
.day.today{background:var(--today)}
.day.today .dn b{color:var(--accent)}
.txt{flex:1;min-width:0;padding-top:2px;font-size:14px;line-height:1.35;color:var(--ink);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.txt.empty{color:var(--past)}
.chip{flex:none;font-size:12px;padding:3px 9px;border-radius:12px;background:var(--accent);color:var(--accent-ink);margin-top:2px}
.chip.done{background:var(--line);color:var(--muted)}
footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}

/* sheet */
#shade{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet h2{font-size:17px;margin-bottom:10px}
#note{width:100%;height:150px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;font-size:15px;line-height:1.4}
#note:focus,#tm:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row label{flex:1;font-size:14px}
#tm{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
#al{width:22px;height:22px;accent-color:var(--accent)}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.btns .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;flex:2}
.btns .del{color:var(--warn)}

/* alarm */
#ring{position:absolute;inset:0;z-index:9;background:rgba(10,14,13,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:#fff}
#ring.on{display:flex}
#ring b{font-size:44px;font-weight:300}
#ring p{font-size:20px;max-width:300px;white-space:pre-wrap}
#ring button{height:50px;padding:0 36px;border-radius:25px;border:0;background:#fff;color:#111;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
#toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:8;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#homebar{position:absolute;left:50%;bottom:7px;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:var(--ink);opacity:.5;z-index:10;cursor:pointer}
#home~#homebar{background:#fff}
#a2h{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:12;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
body:not(.mobile) #a2h{top:44px}
#a2h.on{display:flex}
#a2h p{flex:1;font-size:13.5px;line-height:1.35}
#a2h p b{display:block;font-size:14.5px}
#a2h button{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#a2h .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#pop{position:absolute;inset:0;z-index:13;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px}
#pop.on{display:flex}
#popc{width:100%;max-width:320px;background:var(--surface);color:var(--ink);border-radius:24px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#popc svg{width:64px;height:64px;margin-bottom:12px}
#popc h3{font-size:20px;margin-bottom:6px}
#popc p{font-size:14.5px;line-height:1.45;color:var(--muted);margin-bottom:18px}
#popc p b{color:var(--ink)}
#popc button{width:100%;height:46px;border-radius:14px;border:0;font:inherit;font-size:15px;cursor:pointer}
#popy{background:var(--accent);color:var(--accent-ink);font-weight:600;margin-bottom:8px}
#popn{background:none;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div id="screen">

<div id="home">
  <div id="clock"><b id="ck">9:41</b><span id="cd"></span></div>
  <div id="grid">
    <button class="ico app" id="openApp"><i><small id="icm">MON</small><em id="icd">1</em></i>Jemaica Schedule<span class="badge" id="badge"></span></button>
    <button class="ico" disabled style="opacity:.55"><i>✉</i>Mail</button>
    <button class="ico" disabled style="opacity:.55"><i>☺</i>Photos</button>
    <button class="ico" disabled style="opacity:.55"><i>♪</i>Music</button>
  </div>
  <div id="dock">
    <button class="ico" disabled style="opacity:.55"><i>☎</i></button>
    <button class="ico" disabled style="opacity:.55"><i>✆</i></button>
    <button class="ico" disabled style="opacity:.55"><i>◉</i></button>
    <button class="ico" id="dockApp"><i style="background:#f3f1ec;color:#1f6f5c">▤</i></button>
  </div>
</div>

<div id="app">
  <header>
    <h1>Jemaica Schedule<small id="sub"></small></h1>
    <button class="hb" id="bell">Alerts off</button>
    <button class="hb" id="today">Today</button>
  </header>
  <div id="list"></div>
</div>

<div id="shade"></div>
<div id="sheet">
  <h2 id="sh"></h2>
  <textarea id="note" placeholder="Type your note for this day"></textarea>
  <div class="row"><label for="al">Ring an alarm with this note</label><input type="checkbox" id="al"><input type="time" id="tm" value="09:00"></div>
  <div class="btns"><button class="del" id="del">Delete</button><button id="cls">Close</button><button class="go" id="sv">Save note</button></div>
</div>

<div id="ring"><b id="rt"></b><p id="rx"></p><button id="rd">Dismiss</button></div>
<div id="pop"><div id="popc"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1f6f5c"/><rect x="22" y="26" width="56" height="52" rx="8" fill="#f3f1ec"/><rect x="22" y="26" width="56" height="14" rx="8" fill="#c2410c"/><rect x="32" y="50" width="36" height="5" rx="2" fill="#1c2321"/><rect x="32" y="62" width="24" height="5" rx="2" fill="#1c2321"/></svg><h3 id="popt">Install Jemaica Schedule</h3><p id="popd">Download it to your phone and open it in one tap, like any other app.</p><button id="popy">Install</button><button id="popn">Not now</button></div></div>
<div id="toast"></div>
<div id="homebar" title="Home"></div>
</div></div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY="zyrell.v1", store={}, first=null;
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||"{}");store=r.n||{};first=r.f||null}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({n:store,f:first}))}catch(e){}}
function pad(n){return n<10?"0"+n:""+n}
function k(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt12(t){var p=t.split(":"),h=+p[0];return(h%12||12)+":"+p[1]+(h<12?" AM":" PM")}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

load();
var now0=new Date(); now0.setHours(0,0,0,0);
if(!first){first=k(now0);save()}
var fp=first.split("-"), start=new Date(+fp[0],+fp[1]-1,+fp[2]);
var end=new Date(start.getFullYear()+10,start.getMonth(),start.getDate());
var expired=now0>end;

var mobile=matchMedia("(max-width:700px)").matches;
document.body.classList.toggle("mobile",mobile);

/* calendar: one long column, month after month */
function build(){
  var h="",d=new Date(start),cur=-1,tk=k(now0);
  if(expired){$("list").innerHTML='<div class="day"><div class="txt">This copy of Jemaica Schedule ran for ten years and has now ended.</div></div>';return}
  while(d<=end){
    var m=d.getFullYear()*12+d.getMonth();
    if(m!==cur){cur=m;h+='<div class="mh" data-m="'+m+'">'+MON[d.getMonth()]+'<span>'+d.getFullYear()+'</span></div>'}
    var key=k(d),n=store[key],wd=d.getDay();
    h+='<div class="day'+(wd%6==0?" we":"")+(key===tk?" today":"")+'" data-k="'+key+'" id="d'+key+'"><div class="dn"><b>'+d.getDate()+'</b><span>'+WD[wd]+'</span></div>'+
       '<div class="txt'+(n&&n.text?"":" empty")+'">'+(n&&n.text?esc(n.text):"Tap to write")+'</div>'+chip(n)+'</div>';
    d.setDate(d.getDate()+1);
  }
  $("list").innerHTML=h;
}
function chip(n){return n&&n.alarm&&n.time?'<span class="chip'+(n.fired?" done":"")+'">⏰ '+fmt12(n.time)+'</span>':""}
function refreshDay(key){
  var el=$("d"+key);if(!el)return;var n=store[key];
  el.querySelector(".txt").className="txt"+(n&&n.text?"":" empty");
  el.querySelector(".txt").innerHTML=n&&n.text?esc(n.text):"Tap to write";
  var c=el.querySelector(".chip");if(c)c.remove();
  el.insertAdjacentHTML("beforeend",chip(n));
}

/* editor */
var active=null;
$("list").addEventListener("click",function(e){
  var r=e.target.closest(".day");if(!r||expired)return;
  active=r.getAttribute("data-k");
  var p=active.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]),n=store[active]||{};
  $("sh").textContent=WD[dt.getDay()]+", "+MON[dt.getMonth()]+" "+dt.getDate()+", "+dt.getFullYear();
  $("note").value=n.text||"";$("al").checked=!!n.alarm;$("tm").value=n.time||"09:00";
  $("sheet").classList.add("on");$("shade").classList.add("on");
  setTimeout(function(){$("note").focus()},300);
});
function closeSheet(){$("sheet").classList.remove("on");$("shade").classList.remove("on");$("note").blur()}
$("shade").onclick=closeSheet;$("cls").onclick=closeSheet;
$("sv").onclick=function(){
  var t=$("note").value.trim(),a=$("al").checked&&t.length>0;
  if(!t){delete store[active]}else{store[active]={text:t,alarm:a,time:$("tm").value,fired:false}}
  save();refreshDay(active);closeSheet();badge();
  if(a){ask(function(ok){toast(ok?"Saved. Alarm set for "+fmt12($("tm").value)+".":"Saved. Turn on alerts to get notified while the app is open.")})}
  else toast("Saved.");
};
$("del").onclick=function(){delete store[active];save();refreshDay(active);closeSheet();badge()};

/* alerts */
function permState(){return("Notification" in window)?Notification.permission:"unsupported"}
function bellUI(){var s=permState();$("bell").textContent=s==="granted"?"Alerts on":"Alerts off";$("bell").classList.toggle("on",s==="granted")}
function ask(cb){
  if(!("Notification" in window)){cb&&cb(false);return}
  if(Notification.permission==="granted"){cb&&cb(true);return}
  if(Notification.permission==="denied"){toast("Alerts are blocked in your browser settings.");cb&&cb(false);return}
  Notification.requestPermission().then(function(r){bellUI();cb&&cb(r==="granted")})
}
$("bell").onclick=function(){ask(function(ok){if(ok){toast("Alerts are on.");notify("Jemaica Schedule","Alerts are working.")}})};
function notify(t,b){
  if(permState()!=="granted")return;
  try{new Notification(t,{body:b})}catch(e){
    try{navigator.serviceWorker.getRegistration().then(function(r){r&&r.showNotification(t,{body:b})})}catch(x){}
  }
}
var ac=null,beepT=null;
function beep(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=880;
    o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.4);
    o.start();o.stop(ac.currentTime+.45)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function ring(key,n){
  $("rt").textContent=fmt12(n.time);$("rx").textContent=n.text;$("ring").classList.add("on");
  notify("Jemaica Schedule · "+fmt12(n.time),n.text);
  beep();clearInterval(beepT);beepT=setInterval(beep,1500);
}
$("rd").onclick=function(){$("ring").classList.remove("on");clearInterval(beepT)};
function tick(){
  var d=new Date(),key=k(d),n=store[key],hm=pad(d.getHours())+":"+pad(d.getMinutes());
  if(n&&n.alarm&&!n.fired&&n.time&&hm>=n.time){n.fired=true;save();refreshDay(key);badge();ring(key,n)}
}
setInterval(tick,5000);

/* badge on the home icon */
function badge(){
  var n=store[k(new Date())],c=n&&n.alarm&&!n.fired?1:0;
  $("badge").textContent=c;$("badge").style.display=c?"grid":"none";
}

/* home screen */
function clock(){
  var d=new Date();$("ck").textContent=(d.getHours()%12||12)+":"+pad(d.getMinutes());
  $("cd").textContent=WD[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate();
  $("icm").textContent=WD[d.getDay()].toUpperCase();$("icd").textContent=d.getDate();
}
clock();setInterval(clock,10000);
function openApp(){$("app").classList.add("open");$("home").style.visibility="visible"}
function goHome(){closeSheet();$("app").classList.remove("open")}
$("openApp").onclick=openApp;$("dockApp").onclick=openApp;$("homebar").onclick=goHome;
$("today").onclick=function(){var el=$("d"+k(new Date()));if(el)$("list").scrollTop=el.offsetTop-52};

/* install as phone shortcut */
var dp=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
function hidePop(){$("pop").classList.remove("on")}
function doInstall(){
  if(dp){dp.prompt();if(dp.userChoice)dp.userChoice.then(hidePop);dp=null;return}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $("popt").textContent="Almost done";
  $("popd").innerHTML=ios?"Tap the <b>Share</b> button at the bottom of Safari, then choose <b>Add to Home Screen</b>.":"Tap the <b>⋮</b> menu in your browser, then choose <b>Install app</b> or <b>Add to Home screen</b>.";
  $("popy").style.display="none";$("popn").textContent="Got it";
}
try{
  var ic='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1f6f5c"/><rect x="22" y="26" width="56" height="52" rx="8" fill="#f3f1ec"/><rect x="22" y="26" width="56" height="14" rx="8" fill="#c2410c"/><rect x="32" y="50" width="36" height="5" rx="2" fill="#1c2321"/><rect x="32" y="62" width="24" height="5" rx="2" fill="#1c2321"/></svg>';
  var uri="data:image/svg+xml,"+encodeURIComponent(ic);
  var mf={name:"Jemaica Schedule",short_name:"Jemaica Schedule",display:"standalone",background_color:"#f3f1ec",theme_color:"#1d3b34",icons:[{src:uri,sizes:"any",type:"image/svg+xml",purpose:"any"}]};
  var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));document.head.appendChild(l);
  var a=document.createElement("link");a.rel="apple-touch-icon";a.href=uri;document.head.appendChild(a);
  var f=document.createElement("link");f.rel="icon";f.href=uri;document.head.appendChild(f);
}catch(e){}

var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;

if(!standalone&&!expired){setTimeout(function(){$("pop").classList.add("on")},600)}
